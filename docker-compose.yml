# Blackkite: single-VPS stack (spec 9).
#   docker compose up -d db api                 # database + API
#   docker compose --profile dev up -d          # plus Mailpit (dev mail, UI on :8025)
#   docker compose run --rm api bk bootstrap    # first admin + seed profiles
#   docker compose run --rm api bk seed-sources # seed sources (status testing)
#   docker compose up -d worker                 # scheduler: runs active/testing sources
#   (api and worker start `renderer`, the headless browser for browser_list)
#   BK_ENV=dev docker compose run --rm api bk demo-seed   # dev only: fictional demo data
name: blackkite

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackkite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-blackkite}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: app   # no browser in this image (decision 46)
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackkite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blackkite}
      BK_DATA_DIR: /app/data
      BK_ENV: ${BK_ENV:-prod}   # deploy default; bk demo-seed needs dev
      BK_RENDERER_URL: http://renderer:8100
      BK_RENDERER_TOKEN: ${BK_RENDERER_TOKEN:?set BK_RENDERER_TOKEN in .env}
    volumes:
      - bk-data:/app/data   # downloaded documents (never served to members)
    networks: [default, render-internal]
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Healthy once migrations have run and uvicorn serves; the worker waits for it.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Scheduler (spec 5 stage 1): one APScheduler process; a Postgres advisory lock
  # per source keeps two workers from running the same source.
  worker:
    build:
      context: ./api
      target: app
    restart: unless-stopped
    command: ["bk", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      BK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackkite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blackkite}
      BK_DATA_DIR: /app/data
      BK_ENV: ${BK_ENV:-prod}   # deploy default; bk demo-seed needs dev
      BK_RENDERER_URL: http://renderer:8100
      BK_RENDERER_TOKEN: ${BK_RENDERER_TOKEN:?set BK_RENDERER_TOKEN in .env}
    volumes:
      - bk-data:/app/data   # the worker's enrich stage writes documents here
    networks: [default, render-internal]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      renderer:
        condition: service_healthy

  # Headless Chromium for browser_list (decision 46), isolated from everything
  # holding secrets: no env_file, no database URL, no API keys, no volumes. It
  # refuses to start if any of those reach its environment. api and worker call
  # it on render-internal (internal: no route out, nothing else on it); it reaches
  # the sites it renders through render-egress, which only it is on, and every
  # request it makes goes through the URL guard (public addresses only, so not
  # db, api or the host). Not on the default network: it cannot see db.
  renderer:
    build:
      context: ./api
      target: renderer
    restart: unless-stopped
    environment:
      BK_RENDERER_TOKEN: ${BK_RENDERER_TOKEN:?set BK_RENDERER_TOKEN in .env}
      BK_BOT_CONTACT_URL: ${BK_BOT_CONTACT_URL:-}
      BK_RENDERER_MAX_CONCURRENT: ${BK_RENDERER_MAX_CONCURRENT:-2}
      BK_RENDERER_TIMEOUT_SECONDS: ${BK_RENDERER_TIMEOUT_SECONDS:-45}
      BK_RENDERER_MAX_BYTES: ${BK_RENDERER_MAX_BYTES:-5000000}
      BK_RENDERER_TOTAL_BYTES: ${BK_RENDERER_TOTAL_BYTES:-20000000}
      BK_RENDERER_MAX_REQUESTS: ${BK_RENDERER_MAX_REQUESTS:-150}
    networks: [render-internal, render-egress]
    user: "10001"
    init: true                 # reaps Chromium processes killed after a timeout
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"   # SMTP; inside compose use BK_SMTP_HOST=mailpit
      - "127.0.0.1:8025:8025"   # web UI

networks:
  default: {}             # db, api, worker, mailpit
  render-internal:        # api and worker -> renderer; no route out
    internal: true
  render-egress: {}       # renderer only: its way out to the sites it renders

volumes:
  db-data:
  bk-data:
