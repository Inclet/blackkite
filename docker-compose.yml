# Blackkite: single-VPS stack (spec 9). Production defaults; docs/deploy.md is the runbook.
#   docker compose build                         # app, renderer and proxy images
#   docker compose up -d                         # db, api, worker, renderer, proxy
#   docker compose exec api bk bootstrap         # first admin + seed profiles
#   docker compose exec api bk seed-sources      # seed sources (status testing)
# Local testing (BK_ENV=dev, plain HTTP on http://localhost:8080, Mailpit):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile dev up -d
# BK_ENV is prod here whatever .env says; only docker-compose.local.yml sets dev.
#
# Networks:
#   edge            proxy <-> api only. Fixed subnet so the API can trust
#                   X-Forwarded-For from exactly the proxy's address.
#   default         db, api, worker (and mailpit in the dev profile).
#   render-internal api and worker -> renderer; internal: no route out.
#   render-egress   renderer only: its way out to the sites it renders.
# Only the proxy publishes ports. db and api are not reachable from outside.
name: blackkite

# Memory budget for a 4 GB VPS (docs/deploy.md):
#   db ~400m + api ~300m + proxy ~50m + renderer 1g + worker 768m ≈ 2.5 GB,
#   leaving ~1.5 GB for the OS, page cache and swap headroom.
#   Renderer and worker have configurable limits (BK_RENDERER_MEM_LIMIT,
#   BK_WORKER_MEM_LIMIT); lower them if the VPS has less memory.
#
# Container logs rotate (json-file): at most 5 x 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  BK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackkite}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-blackkite}
  BK_DATA_DIR: /app/data
  BK_ENV: prod
  BK_COOKIE_SECURE: "true"
  # Emailed links ({web}/auth/confirm#token=...) point at the public site.
  BK_WEB_BASE_URL: https://${BK_DOMAIN:-}
  BK_RENDERER_URL: http://renderer:8100
  BK_RENDERER_TOKEN: ${BK_RENDERER_TOKEN:?set BK_RENDERER_TOKEN in .env}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackkite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-blackkite}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: app   # no browser in this image (decision 46)
      secrets: [build_ca]
    image: blackkite-app:${BK_IMAGE_TAG:-local}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      # Peer whose X-Forwarded-For uvicorn believes: the proxy, and only it.
      BK_FORWARDED_ALLOW_IPS: ${BK_PROXY_IP:-172.30.250.10}
    volumes:
      - bk-data:/app/data   # downloaded documents (never served to members)
    networks:
      default: {}
      render-internal: {}
      edge: {}
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      # Healthy once migrations have run and uvicorn serves; the worker and proxy wait for it.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Scheduler (spec 5 stage 1): one APScheduler process; a Postgres advisory lock
  # per source keeps two workers from running the same source.
  worker:
    image: blackkite-app:${BK_IMAGE_TAG:-local}   # built by `api`
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BK_WORKER_MEM_LIMIT:-768m}
    command: ["bk", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - bk-data:/app/data   # the worker's enrich stage writes documents here
    networks: [default, render-internal]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      # The scheduler is PID 1 (the container stops with it); this checks that
      # its settings load and the database answers.
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from blackkite.db.session import get_sessionmaker; s = get_sessionmaker()(); s.execute(text('select 1')); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Headless Chromium for browser_list (decision 46), isolated from everything
  # holding secrets: no env_file, no database URL, no API keys, no volumes. It
  # refuses to start if any of those reach its environment. api and worker call
  # it on render-internal (internal: no route out, nothing else on it); it reaches
  # the sites it renders through render-egress, which only it is on, and every
  # request it makes goes through the URL guard (public addresses only, so not
  # db, api or the host). Not on the default network: it cannot see db.
  renderer:
    build:
      context: ./api
      target: renderer
      secrets: [build_ca]
      args:
        # renderer-debian (default) or renderer-prebuilt (api/Dockerfile).
        RENDERER_BASE: ${BK_RENDERER_BASE:-renderer-debian}
    image: blackkite-renderer:${BK_IMAGE_TAG:-local}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BK_RENDERER_MEM_LIMIT:-1g}
    environment:
      BK_RENDERER_TOKEN: ${BK_RENDERER_TOKEN:?set BK_RENDERER_TOKEN in .env}
      BK_BOT_CONTACT_URL: ${BK_BOT_CONTACT_URL:-}
      BK_RENDERER_MAX_CONCURRENT: ${BK_RENDERER_MAX_CONCURRENT:-2}
      BK_RENDERER_TIMEOUT_SECONDS: ${BK_RENDERER_TIMEOUT_SECONDS:-45}
      BK_RENDERER_MAX_BYTES: ${BK_RENDERER_MAX_BYTES:-5000000}
      BK_RENDERER_TOTAL_BYTES: ${BK_RENDERER_TOTAL_BYTES:-20000000}
      BK_RENDERER_MAX_REQUESTS: ${BK_RENDERER_MAX_REQUESTS:-150}
      BK_RENDERER_QUEUE_WAIT_SECONDS: ${BK_RENDERER_QUEUE_WAIT_SECONDS:-30}
      BK_RENDERER_REQUEST_TIMEOUT: ${BK_RENDERER_REQUEST_TIMEOUT:-20}
      BK_RENDERER_SUBRESOURCE_DELAY: ${BK_RENDERER_SUBRESOURCE_DELAY:-0.25}
      BK_RENDERER_MIN_HOST_DELAY: ${BK_RENDERER_MIN_HOST_DELAY:-1}
      BK_RENDERER_MAX_PACE_WAIT_SECONDS: ${BK_RENDERER_MAX_PACE_WAIT_SECONDS:-30}
    networks: [render-internal, render-egress]
    user: "10001"
    init: true                 # reaps Chromium processes killed after a timeout
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The web app (static build) and the reverse proxy in one Caddy image
  # (web/Dockerfile, deploy/caddy/Caddyfile). Automatic HTTPS for BK_DOMAIN;
  # certificates live in the caddy-data volume.
  proxy:
    build:
      context: ./web
      additional_contexts:
        design: ./design
        caddy: ./deploy/caddy
      secrets: [build_ca]
    image: blackkite-proxy:${BK_IMAGE_TAG:-local}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    environment:
      BK_SITE_ADDRESS: ${BK_DOMAIN:-}
      BK_TRUSTED_PROXIES: ${BK_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${BK_PROXY_IP:-172.30.250.10}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8099/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["dev"]
    logging: *logging
    networks: [default]
    ports:
      - "127.0.0.1:1025:1025"   # SMTP; inside compose use BK_SMTP_HOST=mailpit
      - "127.0.0.1:8025:8025"   # web UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default: {}             # db, api, worker, mailpit
  edge:                   # proxy <-> api; BK_FORWARDED_ALLOW_IPS is the proxy's address here
    ipam:
      config:
        - subnet: ${BK_EDGE_SUBNET:-172.30.250.0/24}
  render-internal:        # api and worker -> renderer; no route out
    internal: true
  render-egress: {}       # renderer only: its way out to the sites it renders

volumes:
  db-data:
  bk-data:
  caddy-data:
  caddy-config:

# Opt-in, only for building behind an intercepting HTTPS proxy: BK_BUILD_CA is
# the proxy's CA bundle, mounted for download steps only (never in an image).
# Default: an empty file, so builds use the images' own trust stores.
secrets:
  build_ca:
    file: ${BK_BUILD_CA:-/dev/null}
