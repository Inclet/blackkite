[project]
name = "blackkite"
version = "0.1.0"
description = "Blackkite API and pipeline"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "apscheduler>=3.11.3",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pgvector>=0.5.1",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.4",
    "selectolax>=1.0.2",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
    "defusedxml>=0.7.1",
    "playwright>=1.63,<1.64",
]

[project.scripts]
bk = "blackkite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackkite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette suggests a different HTTP client for TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as argument defaults; that is its intended use.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
