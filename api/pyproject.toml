[project]
name = "blackkite"
version = "0.1.0"
description = "Blackkite API and pipeline"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
bk = "blackkite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackkite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
